version: "3.9"

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: togotruck_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: togotruckconnect
      POSTGRES_USER: togotruck
      POSTGRES_PASSWORD: togotruck_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U togotruck -d togotruckconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: togotruck_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: togotruck_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: togotruck_minio
      MINIO_ROOT_PASSWORD: togotruck_minio_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
